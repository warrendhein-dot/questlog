name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can read the repo and nothing else unless they ask for more.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs exactly what package-lock.json says (reproducible, tamper-evident).
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocking: known high-severity flaws in code that ships to users.
      - name: Audit production dependencies (blocking)
        run: npm run audit:prod
      # Informational: dev-tooling advisories never reach users, so they don't fail the build,
      # but they stay visible here. See docs/THREAT-MODEL.md (accepted risks).
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright builds and starts the production app itself (see playwright.config.ts).
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e-signed-in:
    name: Signed-in browser tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Supabase's own action, with the CLI version pinned to the one we develop with.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # A private, throwaway Supabase in Docker: database, login service and API only. `start` builds
      # the database from supabase/migrations, so the tests run against our real tables, security
      # rules and rate limit. Its keys are generated locally and work nowhere else.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Playwright builds and starts the production app itself, pointed at the throwaway stack
      # (see playwright.signed-in.config.ts).
      - name: Run signed-in browser tests
        run: npm run test:e2e:signed-in
      - name: Show service logs after a failure
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          for name in $(docker ps -a --format '{{.Names}}'); do
            echo "=== $name ==="
            docker logs --tail 25 "$name" 2>&1 | cut -c1-300
          done
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-signed-in
          path: playwright-report/
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
